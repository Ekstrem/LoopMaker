name: Stats (README = задачи)

on:
  push:
    branches: ["main"]
    paths:
      - "5-backlog/**"
      - "README.md"
      - "tools/stats.py"
      - "loop.config.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить, что таблица статусов актуальна
        run: python tools/stats.py --check
