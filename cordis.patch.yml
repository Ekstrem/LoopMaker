# DSH bundle patch — dsh-loopmaker
#
# Мост «outbox-чат петли → сессия роли»: плагин следит за файлами чата
# (`<chatDir>/*.md`), находит строки вида
#
#     - [2026-11-01 10:00] → @FE: посмотри контракт
#
# и доставляет адресату в его сессию сообщение «сообщение от BackEnd: «…»»,
# то есть оживляет тред роли без ручного переключения.
#
# Значения ниже — рабочий пример под XDiary. Свой проект: поправьте chatDir,
# project, roles и (если заголовки сессий не по шаблону) sessions.

- insert:
    - id: loop-chat
      name: dsh-loopmaker
      # Сервисы, нужные на старте. `sessionPersistence` и `sessionProjectionCache`
      # резолвятся лениво внутри плагина: без них мост не падает, а не находит
      # сессию и пишет это в лог.
      inject:
        - agents
        - workspaceRegistry
      config:
        # По умолчанию ВЫКЛЮЧЕН: включайте осознанно, после проверки в dry-run.
        enabled: false
        # Папка outbox-чата (абсолютный путь или относительно корня воркспейса).
        chatDir: 5-tech-backlog/chat
        # Префикс заголовка сессий: "XDairy | Arch", "XDairy | BackEnd", …
        project: XDairy
        titleTemplate: "{project} | {role}"
        # Как будить роль: live-only — только открытый тред (безопасно),
        # resume — поднимать с диска (ломает реестр инструментов, не использовать).
        wake: live-only
        # Файл чата -> роль. Значение: строка (название роли) или
        # { title, tag }: tag — то, что стоит после @ в сообщении.
        roles:
          be: BackEnd
          fe: FrontEnd
          do: DevOps
          te: TestEngineer
          ar: Architect
          tl: TechLead
          po: PO
        # Явные переопределения, если заголовок сессии не собирается шаблоном.
        sessions: {}
        # Текст, который получает адресат. {from} {to} {text} {ts} {file}.
        messageTemplate: "сообщение от {from}: «{text}»"
        # История при КАЖДОМ старте: skip — не будить сессии тем, что уже лежало
        # в чате, deliver — доставить всё, чего нет в seen.
        history: skip
        pollMs: 5000
        # Что видит адресат: pointer — только «в чате be.md есть сообщение от
        # BackEnd, посмотри файл» (экономит контекст, файл — источник правды);
        # copy — с текстом сообщения внутри реплики.
        notifyStyle: pointer
        # @ALL рассылается всем ролям, кроме автора. По умолчанию выключено,
        # чтобы одно сообщение не будило шесть тредов.
        broadcast: false
        dryRun: false
        # Дублировать лог моста в файл (у DSH нет своего лог-файла).
        # Для отладки: logFile: C:\Users\About\.dsh\loopmaker-chat.log
        logFile: ''

        # ---------------- тормоза против пинг-понга ----------------
        # Дебаунс: пачка для адресата ждёт «успокоения» столько мс (0 — сразу).
        # Без него всплеск из пяти строк станет пятью отдельными ходами.
        batchWindowMs: 8000
        batchHeader: "сообщения из чата петли ({count}, последнее от {from}):"
        # Порог 1: сколько раз одна пара «A -> B» может доставить за окно.
        maxHops: 4
        hopWindowMs: 1800000
        # Порог 2: потолок входящих реплик на роль за час.
        maxPerHour: 40
        # После порога переписка уходит координатору, а пара замораживается:
        # он решает — техническое, бизнесовое (PO) или архитектурное (AR).
        escalateTo: tl
        freezeMs: 3600000
        # TTL очереди должен быть больше freezeMs, иначе накопленное за разбор истечёт.
        pendingTtlMs: 7200000

        # ---------------- уведомления в Telegram ----------------
        # Только отправка: бот ничего не поллит, поэтому не конфликтует с другими.
        # Токен кладётся в ~/.dsh/.env под именем из tgTokenEnv.
        tgEnabled: false
        tgTokenEnv: KITCHEN_BOT_TOKEN
        # Пусто — chat id определится по первому сообщению боту (/start).
        tgChatId: ''
        tgEveryMinutes: 2
        tgMaxBuffer: 15
        tgTitle: Чат ролей
