name: Guard secrets (утечки в чате/задачах/доках)

# Шаблон для нового проекта: скопировать в <проект>/.github/workflows/guard-secrets.yml
#
# Проверяет ТОЛЬКО то, что пушится (`--range BASE..HEAD`), поэтому:
#   * ловит секрет даже если его успели зачистить в рабочем дереве перед коммитом;
#   * не пересканирует всю историю на каждом пуше.
# Локально: `python tools/check_secrets.py` (без --range — весь обход).
#
# Находка = красный job. Значения в лог не попадают: печатаются правило,
# файл, строка и длина.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "guard-secrets"
  cancel-in-progress: true

env:
  # Пин на тег, когда LoopMaker стабилизируется: ref: v0.2.0
  LOOPMAKER_REF: main
  LOOPMAKER_REPO: Ekstrem/LoopMaker

jobs:
  guard-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout проекта (нужна история для --range)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout LoopMaker (движок проверки)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LOOPMAKER_REPO }}
          ref: ${{ env.LOOPMAKER_REF }}
          path: .loopmaker

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить секреты в пушимом диапазоне
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -uo pipefail
          after="${AFTER:-}"
          if [ -z "$after" ] || ! git cat-file -e "${after}^{commit}" 2>/dev/null; then
            after=HEAD
          fi
          if [ -z "${BEFORE:-}" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${after}~1..${after}"
          else
            range="${BEFORE}..${after}"
          fi
          echo "range: ${range}"
          python .loopmaker/tools/check_secrets.py --config loop.config.json --range "$range"
